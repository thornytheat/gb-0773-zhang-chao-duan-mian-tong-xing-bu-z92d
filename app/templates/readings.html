<div class="grid"><section class="panel"><h2>来件登记</h2><table><thead><tr><th>原件</th><th>接收</th><th>隔离</th><th>分段</th></tr></thead><tbody>{% for row in reports.readings.files %}<tr><td>{{ row.source }}</td><td>{{ row.accepted }}</td><td>{{ row.rejected }}</td><td>{{ row.segments }}</td></tr>{% endfor %}</tbody></table></section><section class="panel"><h2>潮尺隔离记录</h2>{% for row in reports.readings.rejected %}<p>第 {{ row.line }} 行 · {{ reason[row.code] }}</p><small>{{ row.raw }}</small>{% else %}<p>本场次无隔离行。</p>{% endfor %}</section></div>
