<div class="grid"><section class="panel"><h2>当班原件指纹</h2><dl>{% for name,hash in receipt.inputs.items() %}<dt>{{ name }}</dt><dd class="hash">{{ hash }}</dd>{% endfor %}</dl><button id="rerun" data-run="{{ key }}" type="button">复算本簿</button><output id="feedback" role="status"></output></section><section class="panel"><h2>归档目录</h2><ul>{% for row in history %}<li><a href="{{ url_for('tide_desk.desk', chapter='journal',run=row.run_id) }}">{{ row.run_id[:12] }} · {{ row.started_at }}</a></li>{% endfor %}</ul></section></div>
